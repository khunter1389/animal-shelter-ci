name: CI pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Run it manually from the UI.
env:
  DOCKER_USERNAME: "samson84cc"
  DOCKER_REPO: "animal-shelter"
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build_docker
        run: docker build -t khunter1389/animal-shelter:${{ github.sha }} .
      - name: lint
        run: docker run khunter1389/animal-shelter:${{ github.sha }} python -m pylint .
      - name: test
        run: docker run khunter1389/animal-shelter:${{ github.sha }} python -m pytest tests
