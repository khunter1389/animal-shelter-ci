name: CI pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Run it manually from the UI.
env:
  DOCKER_USERNAME: "khunter1389"
  DOCKER_REPO: "animal-shelter"
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build_docker
        run: docker build -t "$DOCKER_USERNAME/$DOCKER_REPO:$GITHUB_SHA" .
      - name: lint
        run: docker run "$DOCKER_USERNAME/$DOCKER_REPO:$GITHUB_SHA" python -m pylint .
      - name: test
        run: docker run "$DOCKER_USERNAME/$DOCKER_REPO:$GITHUB_SHA" python -m pytest tests
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$DOCKER_USERNAME/$DOCKER_REPO:$GITHUB_SHA"
